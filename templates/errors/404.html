{% extends 'base.html' %}

{% block title %}404 — Page Not Found — RailAway{% endblock %}

  <h2 style="font-size: 1.8rem; margin: 1rem 0 0.5rem 0; color: var(--secondary);">Journey Route Not Found</h2>
