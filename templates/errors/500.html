{% extends 'base.html' %}
{% load static %}

{% block title %}500 — Server Error — RailAway{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; text-align: center; padding: 6rem 1.5rem 8rem 1.5rem;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--danger); line-height: 1;">500</div>
  <h2 style="font-size: 1.8rem; margin: 1rem 0 0.5rem 0; color: var(--secondary);">Temporary Platform Issue</h2>

    Our engineers are attending to the tracks. Please refresh or try again in a moment.

  <a href="{% url 'core:home' %}" class="btn btn-primary btn-lg">
    <i class="fa-solid fa-house"></i> Return to Homepage
  </a>
</div>
{% endblock %}
